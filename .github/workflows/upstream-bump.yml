name: Bump Hermes image pin

# Watches Docker Hub for a newer nousresearch/hermes-agent release tag, bumps
# both Dockerfile pins on a branch, builds both images and runs the contract and
# legacy smoke tests against them, and MERGES only if both pass. Merging to main
# redeploys every service with a Railway deploy trigger on this repo. A failing
# test leaves the PR open for a human; nothing broken reaches main.
#
# The tests run inside this job on purpose: a PR opened with GITHUB_TOKEN does
# not trigger other workflows, so a separate pull_request check would never run.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find newest release tag
        id: latest
        run: |
          set -euo pipefail
          # Release tags only: vYYYY.M.D with an optional .PATCH. Skips latest/main,
          # which are mutable and are exactly what the pin exists to avoid.
          latest=$(curl -fsSL "https://hub.docker.com/v2/repositories/nousresearch/hermes-agent/tags?page_size=100&ordering=last_updated" \
            | python3 -c "
          import json,re,sys
          tags=[t['name'] for t in json.load(sys.stdin)['results']]
          rel=[t for t in tags if re.fullmatch(r'v\d{4}\.\d{1,2}\.\d{1,2}(\.\d+)?', t)]
          key=lambda t: [int(x) for x in t[1:].split('.')]
          print(max(rel, key=key) if rel else '')")
          current=$(grep -oE 'ARG HERMES_IMAGE_VERSION=\S+' Dockerfile | cut -d= -f2)
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Current $current, newest published $latest"

      - name: Open bump PR
        if: steps.latest.outputs.latest != '' && steps.latest.outputs.latest != steps.latest.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.latest.outputs.latest }}
          CURRENT: ${{ steps.latest.outputs.current }}
        run: |
          set -euo pipefail
          branch="bump/hermes-$LATEST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          # Both images: Dockerfile (fresh template deploys) and Dockerfile.legacy-data
          # (services migrated off /data-layout templates) must move together.
          sed -i "s|ARG HERMES_IMAGE_VERSION=.*|ARG HERMES_IMAGE_VERSION=$LATEST|" Dockerfile Dockerfile.legacy-data
          git commit -qam "Bump Hermes image pin to $LATEST"
          # Idempotent: a previous run may have pushed the branch and then failed
          # to open the PR. Rebuild the branch from main and reuse any open PR.
          git push -q --force origin "$branch"
          if gh pr list --head "$branch" --state open --json number -q '.[0].number' | grep -q .; then
            echo "PR for $branch already open"
          else
          gh pr create --title "Bump Hermes image pin to $LATEST" --body "\
          Upstream published \`$LATEST\` (was \`$CURRENT\`).

          This job builds both images and runs test/contract.sh and test/legacy-smoke.sh;
          it merges only if both pass. They catch the failures a release can introduce: the dashboard not
          answering, the auth gate changing shape, the listener going IPv6-only, the
          gateway dying on a stale lock.

          Deployers redeploy from this repo, so a merge reaches other people's agents." \
            --base main --head "$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
        id: pr
      - name: Build both images
        if: steps.pr.outputs.branch != ''
        run: |
          docker build -q -t hermes-agent-dashboard:test .
          docker build -q -f Dockerfile.legacy-data -t hermes-legacy:test .
      - name: Contract test (fresh template image)
        if: steps.pr.outputs.branch != ''
        run: IMAGE=hermes-agent-dashboard:test bash test/contract.sh
      - name: Smoke test (migrated legacy-data image)
        if: steps.pr.outputs.branch != ''
        run: bash test/legacy-smoke.sh hermes-legacy:test
      - name: Merge
        if: steps.pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.branch }}" --squash --delete-branch
